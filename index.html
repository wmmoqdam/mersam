<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2D6C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مرسام — مصمم الإنفوجرافيك العربي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;800;900&family=Readex+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style id="appcss">
:root{
  --sh-ink:#12161F; --sh-ink-2:#1C2230; --sh-paper:#F6F4EF; --sh-card:#FFFFFF;
  --sh-rule:#E2DDD2; --sh-gold:#B8862B; --sh-gold-soft:#F3E7CC; --sh-mut:#6D6759;
  --r:14px; --pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--sh-paper); color:var(--sh-ink);
  font-family:"Tajawal","SF Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  font-size:15px; line-height:1.6; padding-bottom:26px;
  overflow-x:hidden;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2.5px solid var(--sh-gold);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--sh-ink);color:#F2EFE8;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px)/6) 14px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 6px 22px rgba(18,22,31,.22);
}
.brand{display:flex;align-items:center;gap:9px;margin-inline-end:auto;min-width:0}
.brand-seal{
  width:30px;height:30px;border-radius:50%;flex:none;
  background:conic-gradient(from 210deg,#E8C468,#9C6E1C,#F2DC9C,#8A5F17,#E8C468);
  display:flex;align-items:center;justify-content:center;color:#3B2708;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);
}
.brand-seal svg{width:16px;height:16px}
.brand b{font-size:16px;font-weight:800;letter-spacing:-.2px;display:block;line-height:1.15}
.brand small{font-size:10.5px;color:#9E9789;letter-spacing:.4px}
.tb-btn{
  width:38px;height:38px;border-radius:11px;background:#242B3B;color:#EFEAE0;
  display:flex;align-items:center;justify-content:center;flex:none;
  transition:background .15s,transform .1s;
}
.tb-btn:active{transform:scale(.94)}
.tb-btn.gold{background:linear-gradient(180deg,#E2B75A,#B8862B);color:#241704}
.tb-btn svg{width:19px;height:19px}

.segwrap{padding:12px 14px 0;max-width:1180px;margin:0 auto}
.seg{display:flex;background:#EAE5DA;border-radius:12px;padding:4px;gap:4px}
.seg button{
  flex:1;padding:9px 6px;border-radius:9px;font-weight:800;font-size:13.5px;
  color:var(--sh-mut);display:flex;align-items:center;justify-content:center;gap:6px;
}
.seg button svg{width:16px;height:16px}
.seg button[aria-selected="true"]{background:var(--sh-card);color:var(--sh-ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}

.layout{max-width:1180px;margin:0 auto;padding:14px;display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:1000px){
  .layout{grid-template-columns:minmax(360px,420px) 1fr;align-items:start}
  .seg{display:none}
  .pane{display:block !important}
  .editor{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto}
}
.pane{display:none}
.pane.on{display:block}

/* ---------- editor ---------- */
.editor{display:flex;flex-direction:column;gap:10px}
.acc{background:var(--sh-card);border:1px solid var(--sh-rule);border-radius:var(--r);overflow:hidden}
.acc>summary{
  list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px;
  font-weight:800;font-size:14px;
}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .chev{margin-inline-start:auto;transition:transform .2s;color:var(--sh-mut)}
.acc[open]>summary .chev{transform:rotate(180deg)}
.acc>summary .chev svg{width:16px;height:16px;display:block}
.acc>summary .ico{
  width:28px;height:28px;border-radius:8px;background:var(--sh-gold-soft);color:#7A5714;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.acc>summary .ico svg{width:15px;height:15px}
.acc-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--sh-rule);padding-top:14px}

.fld{display:flex;flex-direction:column;gap:5px}
.fld>label{font-size:11.5px;font-weight:700;color:var(--sh-mut);letter-spacing:.2px}
.inp{
  width:100%;padding:10px 12px;border:1.5px solid var(--sh-rule);border-radius:10px;
  background:#FCFBF8;font-size:14px;font-weight:500;transition:border-color .15s,background .15s;
}
.inp:focus{outline:none;border-color:var(--sh-gold);background:#fff}
textarea.inp{resize:vertical;min-height:64px;line-height:1.65}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}

.item{border:1.5px solid var(--sh-rule);border-radius:12px;padding:11px;background:#FCFBF8;display:flex;flex-direction:column;gap:9px}
.item-head{display:flex;align-items:center;gap:8px}
.item-num{
  font-size:11px;font-weight:800;color:var(--sh-mut);background:#EDE8DC;
  border-radius:6px;padding:2px 7px;
}
.mini{width:30px;height:30px;border-radius:9px;background:#EDE8DC;color:#5A5446;display:flex;align-items:center;justify-content:center;flex:none}
.mini svg{width:15px;height:15px}
.mini.danger{background:#FBE9E9;color:#A32B2B}
.mini:active{transform:scale(.92)}
.iconbtn{
  display:flex;align-items:center;gap:7px;padding:8px 10px;border:1.5px solid var(--sh-rule);
  border-radius:10px;background:#fff;font-size:12.5px;font-weight:700;
}
.iconbtn svg{width:17px;height:17px;color:var(--sh-gold)}
.addbtn{
  width:100%;padding:11px;border:1.5px dashed #CFC8B8;border-radius:11px;
  font-weight:800;font-size:13px;color:#6B6555;display:flex;align-items:center;justify-content:center;gap:7px;
  background:#FAF8F3;
}
.addbtn svg{width:16px;height:16px}
.addbtn:active{background:#F2EEE4}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:8px 12px;border-radius:999px;border:1.5px solid var(--sh-rule);background:#fff;
  font-size:12.5px;font-weight:700;
}
.chip[aria-pressed="true"]{border-color:var(--sh-ink);background:var(--sh-ink);color:#F5F1E8}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.sw{width:44px;height:44px;border-radius:12px;border:2.5px solid transparent;position:relative;overflow:hidden}
.sw[aria-pressed="true"]{border-color:var(--sh-ink);box-shadow:0 0 0 2px #fff inset}
.sw i{position:absolute;inset:0;display:block}
.sw i:last-child{inset:auto 0 0 0;height:38%}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:700}
.sw-track{width:46px;height:27px;border-radius:999px;background:#D8D2C4;position:relative;transition:background .18s;flex:none}
.sw-track b{position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw-track[aria-pressed="true"]{background:var(--sh-gold)}
.sw-track[aria-pressed="true"] b{transform:translateX(-19px)}
.hint{font-size:11.5px;color:var(--sh-mut);line-height:1.55}

/* ---------- stage ---------- */
.stage{width:100%;overflow:hidden}
.stage-inner{width:800px;transform-origin:top right;will-change:transform}
.stage-note{
  display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--sh-mut);
  padding:0 2px 9px;font-weight:600;
}
.stage-note svg{width:14px;height:14px;flex:none}

/* ---------- the artwork ---------- */
#canvas{
  --page:#F4F6FA; --card:#FFFFFF; --line:#DCE4F0; --ink:#0A2D6C; --ink2:#123C8F;
  --gold:#F0C24B; --gold2:#B98328; --crest:#4A0A16; --tx:#0B1B3A; --txs:#5A6480; --oncard:#0B1B3A;
  width:800px;min-height:1120px;background:var(--page);color:var(--tx);
  border-radius:26px;position:relative;overflow:hidden;
  padding:26px 26px 22px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;
  box-shadow:0 18px 46px rgba(18,22,31,.16);border:1px solid var(--line);
  font-family:"Tajawal","SF Arabic",Tahoma,"Noto Sans Arabic",sans-serif;
}
#canvas[data-theme="emerald_gold"]{--page:#F1F7F3;--line:#D5E6DC;--ink:#064E3B;--ink2:#0B6B52;--gold:#EFC94C;--gold2:#A9812B;--crest:#12352A;--tx:#06281F;--txs:#4C6B60;--oncard:#06281F}
#canvas[data-theme="ruby_gold"]{--page:#FAF3F3;--line:#EEDADA;--ink:#7A1220;--ink2:#9B1B2C;--gold:#F3C55A;--gold2:#A8791F;--crest:#3E0A10;--tx:#3A0D14;--txs:#7C5157;--oncard:#3A0D14}
#canvas[data-theme="sapphire_silver"]{--page:#F2F6F9;--line:#D9E4EC;--ink:#0C4A6E;--ink2:#14618E;--gold:#CBD6E1;--gold2:#8CA1B4;--crest:#0B2A3F;--tx:#0A2436;--txs:#54697C;--oncard:#0A2436}
#canvas[data-theme="midnight_dark"]{--page:#0E1420;--card:#18202F;--line:#2A3547;--ink:#1B2740;--ink2:#263552;--gold:#E8B54B;--gold2:#9C7526;--crest:#241016;--tx:#E9EEF7;--txs:#98A5BA;--oncard:#E9EEF7}

#canvas .arc{
  position:absolute;top:-140px;left:-90px;right:-90px;height:250px;border-radius:0 0 50% 50%;
  background:linear-gradient(105deg,var(--ink) 0%,var(--ink2) 52%,var(--ink) 100%);
}
#canvas .pattern{
  position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(circle at 50% 50%, rgba(150,110,30,.22) 1.4px, transparent 1.6px),
    radial-gradient(circle at 50% 50%, rgba(20,45,100,.10) 1.1px, transparent 1.3px);
  background-size:26px 26px,26px 26px;background-position:0 0,13px 13px;
}
#canvas .stack{position:relative;z-index:2;display:flex;flex-direction:column;gap:18px}

/* logos */
#canvas .logos{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;padding-top:6px}
#canvas .logo{
  background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 10px;
  display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:104px;justify-content:center;
  box-shadow:0 3px 10px rgba(10,25,60,.06);
}
#canvas .logo .mark{
  width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--ink2),var(--ink));color:#fff;
}
#canvas .logo .mark svg{width:23px;height:23px}
#canvas .logo.alt .mark{background:linear-gradient(160deg,var(--gold),var(--gold2));color:#2E1D02}
#canvas .logo img{max-height:44px;max-width:112px;object-fit:contain}
#canvas .logo b{font-size:13px;font-weight:800;color:var(--oncard);line-height:1.35}
#canvas .logo span{font-size:10.5px;color:var(--txs)}

/* the seal — signature element */
#canvas .seal{
  width:118px;height:118px;border-radius:50%;position:relative;flex:none;
  background:conic-gradient(from 200deg,#F6E3AE,var(--gold2),#FBF0D2,#8E6418,#F0CE72,var(--gold2),#F6E3AE);
  padding:5px;box-shadow:0 10px 24px rgba(90,60,10,.32);
}
#canvas .seal::after{
  content:"";position:absolute;inset:9px;border-radius:50%;
  border:1.5px dashed rgba(255,232,170,.55);
  border-color:color-mix(in srgb, var(--gold) 55%, transparent);pointer-events:none;
}
#canvas .seal-in{
  width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 34% 26%, #6B4A12 0%, #3E2A08 55%, #241701 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:#F3DFAA;text-align:center;padding:12px;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.6);
}
#canvas .seal-in svg{width:27px;height:27px;color:#F0CE72}
#canvas .seal-in b{font-size:11px;font-weight:900;line-height:1.22;max-width:92px;overflow-wrap:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#canvas .seal-in span{font-size:8.5px;color:#C9AE72;letter-spacing:.3px}

/* title plate */
#canvas .plate{
  background:linear-gradient(100deg,var(--gold2),var(--gold),#FDF2CE,var(--gold),var(--gold2));
  padding:5px;border-radius:22px;box-shadow:0 8px 22px rgba(90,60,10,.2);
}
#canvas .plate-in{
  background:var(--crest);
  border:2px solid var(--gold);
  border-color:color-mix(in srgb,var(--gold) 75%, transparent);
  border-radius:17px;padding:16px 24px;text-align:center;
}
#canvas h1{
  margin:0;font-size:40px;font-weight:900;line-height:1.28;color:#F8ECC9;letter-spacing:-.5px;
  text-shadow:0 2px 3px rgba(0,0,0,.45);
}
#canvas .sub{margin:0;font-size:21px;font-weight:800;color:var(--tx);text-align:center;line-height:1.5}
#canvas .badge{
  align-self:center;display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,var(--ink2),var(--ink));color:#fff;
  padding:10px 22px;border-radius:999px;font-weight:800;font-size:14px;
  border:1px solid rgba(255,255,255,.28);box-shadow:0 6px 16px rgba(10,25,60,.22);
}
#canvas .badge svg{width:16px;height:16px;color:var(--gold)}
#canvas .lede{
  background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px 20px;
  text-align:center;font-size:16px;font-weight:700;color:var(--oncard);line-height:1.75;
}

/* section cards */
#canvas .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
#canvas .cards.c4{grid-template-columns:repeat(4,1fr)}
#canvas .cards.c3{grid-template-columns:repeat(3,1fr)}
#canvas .card{
  background:linear-gradient(150deg,var(--ink2),var(--ink));color:#fff;border-radius:18px;
  padding:13px;display:flex;align-items:flex-start;gap:10px;
  border:1px solid rgba(255,255,255,.14);box-shadow:0 5px 14px rgba(10,25,60,.2);
}
#canvas .card .cico{
  width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;color:var(--gold);flex:none;
}
#canvas .card .cico svg{width:19px;height:19px}
#canvas .card b{display:block;font-size:13px;color:var(--gold);font-weight:800;margin-bottom:2px}
#canvas .card p{margin:0;font-size:12px;line-height:1.55;color:#E7ECF7}

/* ribbon */
#canvas .ribbon{display:flex;align-items:center;justify-content:center;gap:10px}
#canvas .ribbon svg{width:20px;height:20px;color:var(--txs)}
#canvas .ribbon span{
  background:linear-gradient(180deg,var(--ink2),var(--ink));color:#fff;
  padding:9px 26px;border-radius:999px;font-weight:800;font-size:15px;
  box-shadow:0 5px 14px rgba(10,25,60,.2);
}

/* notes */
#canvas .notes{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:9px}
#canvas .note{
  display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:13px;
  background:var(--page);
  background:color-mix(in srgb, var(--page) 70%, var(--card));border:1px solid var(--line);
}
#canvas .note>b{font-size:13px;font-weight:800;width:34%;color:var(--oncard)}
#canvas .note .vals{display:flex;gap:8px;flex:1;justify-content:flex-end}
#canvas .tag{
  display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:9px;
  font-size:12px;font-weight:800;border:1.5px solid;
}
#canvas .tag svg{width:14px;height:14px}
#canvas .tag.no{background:#FDECEC;border-color:#F3C3C3;color:#A02020}
#canvas .tag.yes{background:#E9F8EF;border-color:#B7E5C9;color:#166534}

/* conditions */
#canvas .crest-bar{align-self:center;background:linear-gradient(100deg,var(--gold2),var(--gold),#FDF2CE,var(--gold),var(--gold2));padding:4px;border-radius:16px;max-width:520px;width:100%}
#canvas .crest-bar div{background:var(--crest);border-radius:12px;padding:9px 18px;text-align:center;color:#F5E5BC;font-weight:800;font-size:15px}
#canvas .conds{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
#canvas .cond{
  background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 8px;
  display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;
}
#canvas .cond .cico{width:36px;height:36px;border-radius:12px;background:var(--ink);color:var(--gold);display:flex;align-items:center;justify-content:center}
#canvas .cond .cico svg{width:18px;height:18px}
#canvas .cond b{font-size:12.5px;font-weight:800;color:var(--oncard);line-height:1.4}

/* footer */
#canvas .foot{
  position:relative;z-index:2;align-self:center;width:100%;max-width:640px;
  background:linear-gradient(100deg,var(--ink),var(--ink2),var(--ink));color:#fff;
  border-radius:999px;padding:13px 26px;display:flex;align-items:center;justify-content:center;gap:10px;
  border:1px solid rgba(255,255,255,.26);box-shadow:0 8px 20px rgba(10,25,60,.26);
  font-weight:800;font-size:14px;text-align:center;
}
#canvas .foot svg{width:18px;height:18px;color:var(--gold);flex:none}
#canvas [contenteditable="true"]{outline:none;border-radius:6px}
#canvas [contenteditable="true"]:focus{box-shadow:0 0 0 2px var(--gold)}

/* ---------- icon picker ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.on{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(18,22,31,.55)}
.sheet-body{
  position:absolute;left:0;right:0;bottom:0;max-height:76vh;background:var(--sh-card);
  border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px;
}
@media(min-width:700px){.sheet-body{max-width:520px;margin:0 auto;bottom:auto;top:50%;transform:translateY(-50%);border-radius:20px;left:16px;right:16px}}
.sheet-head{display:flex;align-items:center;gap:10px;font-weight:800}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:9px;overflow:auto;padding-bottom:6px}
.icon-grid button{
  aspect-ratio:1;border:1.5px solid var(--sh-rule);border-radius:13px;background:#FCFBF8;
  display:flex;align-items:center;justify-content:center;color:#2A3242;
}
.icon-grid button svg{width:21px;height:21px}
.icon-grid button:active{background:var(--sh-gold-soft)}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(24px);
  background:var(--sh-ink);color:#F4F0E7;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:700;
  z-index:80;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .topbar,.segwrap,.editor,.stage-note,.toast,.sheet{display:none !important}
  body{background:#fff;padding:0}
  .layout{padding:0;display:block}
  #paneView{display:block !important}
  .stage-inner{transform:scale(.945) !important;transform-origin:top center}
  #canvas{box-shadow:none;border-radius:0;border:0}
  @page{size:A4 portrait;margin:6mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-seal" id="brandSeal"></span>
    <span><b>مِرسام</b><small>مصمم الإنفوجرافيك العربي</small></span>
  </div>
  <button class="tb-btn" id="btnOpen" title="فتح ملف تصميم" aria-label="فتح ملف تصميم"></button>
  <button class="tb-btn" id="btnSave" title="حفظ ملف تصميم" aria-label="حفظ ملف تصميم"></button>
  <button class="tb-btn" id="btnPrint" title="طباعة أو حفظ PDF" aria-label="طباعة أو حفظ PDF"></button>
  <button class="tb-btn gold" id="btnPng" title="تنزيل صورة" aria-label="تنزيل صورة"></button>
</header>

<div class="segwrap">

};
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2200);
}

function logoHTML(k, alt){
  const L = S.data[k];
  const inner = L.img
    ? '<img src="'+L.img+'" alt="">'
    : '<span class="mark">'+svg(L.icon||'building')+'</span>';
  return '<div class="logo'+(alt?' alt':'')+'">'+inner+
    '<b data-e="'+k+'.title">'+esc(L.title)+'</b>'+
    (L.subtitle?'<span data-e="'+k+'.subtitle">'+esc(L.subtitle)+'</span>':'')+'</div>';
}

      '<div class="badge">'+svg('sparkles')+'<span'+ed+' data-e="badgeText">'+esc(d.badgeText)+'</span></div>'+
      '<div class="lede"'+ed+' data-e="description">'+esc(d.description)+'</div>'+
      (nCards ? '<div class="cards '+cls+'">'+ d.sections.map(function(s){
        return '<div class="card"><span class="cico">'+svg(s.icon||'star')+'</span>'+
               '<div><b>'+esc(s.title)+'</b><p>'+esc(s.text)+'</p></div></div>';
      }).join('') +'</div>' : '')+
      (d.notes.length ?
        '<div class="ribbon">'+svg('arrowDown')+'<span'+ed+' data-e="notesHeaderTitle">'+esc(d.notesHeaderTitle)+'</span>'+svg('arrowDown')+'</div>'+
        '<div class="notes">'+ d.notes.map(function(n){
          return '<div class="note"><b>'+esc(n.label)+'</b><div class="vals">'+
            '<span class="tag no">'+svg('x')+esc(n.no)+'</span>'+
            '<span class="tag yes">'+svg('check')+esc(n.ok)+'</span></div></div>';
        }).join('') +'</div>' : '')+
      (d.conditions.length ?
        '<div class="crest-bar"><div'+ed+' data-e="conditionsHeaderTitle">'+esc(d.conditionsHeaderTitle)+'</div></div>'+
        '<div class="conds">'+ d.conditions.map(function(c){
          return '<div class="cond"><span class="cico">'+svg(c.icon||'check')+'</span><b>'+esc(c.title)+'</b></div>';
        }).join('') +'</div>' : '')+
    '</div>'+
    '<div class="foot">'+svg('bell')+'<span'+ed+' data-e="footer">'+esc(d.footer)+'</span></div>'+
  '</div>';

  $('#stageInner').innerHTML = html;
  fitStage();

  document.querySelectorAll('#canvas [contenteditable="true"]').forEach(function(el){
    el.addEventListener('blur', function(){
      const path = el.getAttribute('data-e'); const val = el.innerText.trim();
      if(path.indexOf('.')>0){ const p=path.split('.'); S.data[p[0]][p[1]] = val; }
      else S.data[path] = val;
      const mirror = document.querySelector('[data-bind="'+path+'"]');
      if(mirror) mirror.value = val;
    });
    el.addEventListener('keydown', function(e){ if(e.key==='Enter' && el.tagName==='H1'){ e.preventDefault(); el.blur(); } });
  });
}

function fitStage(){
  const stage = document.querySelector('.stage'); if(!stage) return;
  const w = stage.clientWidth || 340;
  const s = Math.min(1, w/800);
  const inner = $('#stageInner');
  inner.style.transform = 'scale('+s+')';
  const c = $('#canvas');
  inner.style.height = c ? (c.offsetHeight*s)+'px' : 'auto';
}
window.addEventListener('resize', fitStage);

/* ============================================================
   5) المحرر
   ============================================================ */
function fld(label, path, multiline, ph){
  const val = path.indexOf('.')>0 ? S.data[path.split('.')[0]][path.split('.')[1]] : S.data[path];
  const tag = multiline ? 'textarea' : 'input';
  return '<div class="fld"><label>'+label+'</label>'+
    '<'+tag+' class="inp" data-bind="'+path+'" placeholder="'+(ph||'')+'"'+
    (multiline?' rows="3">'+esc(val)+'</textarea>':' value="'+esc(val)+'">')+
  '</div>';
}
let ACC_OPEN = [true,false,false,false,false,false];
let ACC_I = 0;
function acc(icon, title, body){
  const open = ACC_OPEN[ACC_I++];
  return '<details class="acc"'+(open?' open':'')+'><summary><span class="ico">'+svg(icon)+'</span>'+title+
  '<span class="chev">'+svg('down')+'</span></summary><div class="acc-body">'+body+'</div></details>';
}

function renderEditor(){
  const d = S.data;
  const live = document.querySelectorAll('#paneEdit .acc');
  if(live.length) ACC_OPEN = Array.from(live).map(a=>a.open);
  ACC_I = 0;
  const keepY = window.scrollY;

  const presetChips = '<div class="chips">'+ PRESETS.map(function(p){
    return '<button class="chip" data-preset="'+p.id+'">'+p.name+'</button>';
  }).join('') +'</div>';

  const content = presetChips +
    fld('العنوان الرئيسي','title') +
    fld('العنوان الفرعي','subtitle') +
    fld('نص الشارة','badgeText') +
    fld('الوصف','description',true) +
    fld('السطر الختامي','footer',true);

  const logos = ['logo1','logo2','logo3'].map(function(k,i){
    const L = d[k];
    const names = {logo1:'الشعار الأيمن', logo2:'الختم الذهبي (الوسط)', logo3:'الشعار الأيسر'};
    return '<div class="item"><div class="item-head"><span class="item-num">'+names[k]+'</span></div>'+
      fld('الاسم', k+'.title') + fld('السطر الصغير', k+'.subtitle') +
      '<div class="row">'+
        '<button class="iconbtn" data-icon="'+k+'.icon">'+svg(L.icon||'building')+'<span>الأيقونة</span></button>'+
        (k!=='logo2' ? '<button class="iconbtn" data-img="'+k+'">'+svg('image')+'<span>'+(L.img?'تغيير الصورة':'رفع صورة')+'</span></button>' : '')+
      '</div>'+
      (k!=='logo2' && L.img ? '<button class="iconbtn" data-rmimg="'+k+'">'+svg('trash')+'<span>إزالة الصورة</span></button>' : '')+
    '</div>';
  }).join('');

  const cards = d.sections.map(function(s,i){
    return '<div class="item"><div class="item-head"><span class="item-num">بطاقة '+(i+1)+'</span>'+
      '<button class="mini" data-move="sections:'+i+':-1" aria-label="أعلى">'+svg('up')+'</button>'+
      '<button class="mini" data-move="sections:'+i+':1" aria-label="أسفل">'+svg('down')+'</button>'+
      '<button class="mini danger" data-del="sections:'+i+'" aria-label="حذف">'+svg('trash')+'</button></div>'+
      '<input class="inp" data-list="sections:'+i+':title" value="'+esc(s.title)+'" placeholder="العنوان">'+
      '<textarea class="inp" rows="2" data-list="sections:'+i+':text" placeholder="النص">'+esc(s.text)+'</textarea>'+
      '<button class="iconbtn" data-icon="sections:'+i+':icon">'+svg(s.icon||'star')+'<span>الأيقونة</span></button></div>';
  }).join('') + '<button class="addbtn" data-add="sections">'+svg('plus')+'إضافة بطاقة</button>';

  const notes = fld('عنوان قسم الملاحظات','notesHeaderTitle') +
    d.notes.map(function(n,i){
      return '<div class="item"><div class="item-head"><span class="item-num">ملاحظة '+(i+1)+'</span>'+
      '<button class="mini" data-move="notes:'+i+':-1" aria-label="أعلى">'+svg('up')+'</button>'+
      '<button class="mini" data-move="notes:'+i+':1" aria-label="أسفل">'+svg('down')+'</button>'+
      '<button class="mini danger" data-del="notes:'+i+'" aria-label="حذف">'+svg('trash')+'</button></div>'+
      '<input class="inp" data-list="notes:'+i+':label" value="'+esc(n.label)+'" placeholder="البند">'+
      '<div class="row">'+
        '<input class="inp" data-list="notes:'+i+':ok" value="'+esc(n.ok)+'" placeholder="الصحيح">'+
        '<input class="inp" data-list="notes:'+i+':no" value="'+esc(n.no)+'" placeholder="الخطأ">'+
      '</div></div>';
    }).join('') + '<button class="addbtn" data-add="notes">'+svg('plus')+'إضافة ملاحظة</button>';

  const conds = fld('عنوان قسم المعايير','conditionsHeaderTitle') +
    d.conditions.map(function(c,i){
      return '<div class="item"><div class="item-head"><span class="item-num">معيار '+(i+1)+'</span>'+
      '<button class="mini" data-move="conditions:'+i+':-1" aria-label="أعلى">'+svg('up')+'</button>'+
      '<button class="mini" data-move="conditions:'+i+':1" aria-label="أسفل">'+svg('down')+'</button>'+
      '<button class="mini danger" data-del="conditions:'+i+'" aria-label="حذف">'+svg('trash')+'</button></div>'+
      '<input class="inp" data-list="conditions:'+i+':title" value="'+esc(c.title)+'" placeholder="نص المعيار">'+
      '<button class="iconbtn" data-icon="conditions:'+i+':icon">'+svg(c.icon||'check')+'<span>الأيقونة</span></button></div>';
    }).join('') + '<button class="addbtn" data-add="conditions">'+svg('plus')+'إضافة معيار</button>';

  const look =
    '<div class="fld"><label>لوحة الألوان</label><div class="swatches">'+
      THEMES.map(function(t){
        return '<button class="sw" data-theme="'+t.id+'" title="'+t.name+'" aria-label="'+t.name+'" aria-pressed="'+(S.theme.preset===t.id)+'">'+
        '<i style="background:'+t.a+'"></i><i style="background:'+t.b+'"></i></button>';
      }).join('') +
    '</div></div>'+
    '<div class="fld"><label>الخط</label><div class="chips">'+
      FONTS.map(function(f){ return '<button class="chip" data-font="'+f+'" aria-pressed="'+(S.theme.font===f)+'" style="font-family:\''+f+'\',Tajawal">'+f+'</button>'; }).join('')+
    '</div></div>'+
    '<div class="switch"><span>نقشة الخلفية</span><button class="sw-track" data-toggle="pattern" aria-pressed="'+S.theme.pattern+'"><b></b></button></div>'+
    '<div class="switch"><span>التحرير المباشر على التصميم</span><button class="sw-track" data-toggle="inline" aria-pressed="'+S.inline+'"><b></b></button></div>'+
    '<p class="hint">مع التحرير المباشر: المس أي نص داخل التصميم في تبويب «معاينة» واكتب فوقه.</p>';

  $('#paneEdit').innerHTML =
    acc('type','النصوص والقوالب', content) +
    acc('seal','الشعارات والختم', logos) +
    acc('grid','البطاقات ('+d.sections.length+')', cards) +
    acc('clipboard','جدول الملاحظات ('+d.notes.length+')', notes) +
    acc('check','المعايير ('+d.conditions.length+')', conds) +
    acc('palette','المظهر', look);
  if(keepY) window.scrollTo(0, keepY);
}

function setPath(path, val){
  if(path.indexOf('.')>0){ const p = path.split('.'); S.data[p[0]][p[1]] = val; }
  else S.data[path] = val;
}

/* أحداث المحرر */
$('#paneEdit').addEventListener('input', function(e){
  const t = e.target;
  if(t.dataset.bind){ setPath(t.dataset.bind, t.value); renderCanvas(); return; }
  if(t.dataset.list){
    const p = t.dataset.list.split(':');
    S.data[p[0]][+p[1]][p[2]] = t.value; renderCanvas();
  }
});

$('#paneEdit').addEventListener('click', function(e){
  const b = e.target.closest('button'); if(!b) return;

  if(b.dataset.preset){
    const p = PRESETS.find(x=>x.id===b.dataset.preset);
    S.data = JSON.parse(JSON.stringify(p.data));
    renderEditor(); renderCanvas(); toast('تم تطبيق قالب «'+p.name+'»'); return;
  }
  if(b.dataset.add){
    const k = b.dataset.add;
    if(k==='sections') S.data.sections.push({title:'عنوان جديد', text:'نص قصير.', icon:'star'});
    if(k==='notes') S.data.notes.push({label:'بند جديد', ok:'الصحيح', no:'الخطأ'});
    if(k==='conditions') S.data.conditions.push({title:'معيار جديد', icon:'check'});
    renderEditor(); renderCanvas(); return;
  }
  if(b.dataset.del){
    const p = b.dataset.del.split(':');
    S.data[p[0]].splice(+p[1],1); renderEditor(); renderCanvas(); return;
  }
  if(b.dataset.move){
    const p = b.dataset.move.split(':'), arr = S.data[p[0]], i = +p[1], j = i + (+p[2]);
    if(j<0 || j>=arr.length) return;
    const tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
    renderEditor(); renderCanvas(); return;
  }
  if(b.dataset.icon){ openIconPicker(b.dataset.icon); return; }
  if(b.dataset.img){ pendingImg = b.dataset.img; $('#imgPicker').click(); return; }
  if(b.dataset.rmimg){ S.data[b.dataset.rmimg].img=''; renderEditor(); renderCanvas(); return; }
  if(b.dataset.theme){ S.theme.preset = b.dataset.theme; renderEditor(); renderCanvas(); return; }
  if(b.dataset.font){ S.theme.font = b.dataset.font; renderEditor(); renderCanvas(); return; }
  if(b.dataset.toggle){
    const k = b.dataset.toggle;
    if(k==='pattern') S.theme.pattern = !S.theme.pattern; else S.inline = !S.inline;
    renderEditor(); renderCanvas(); return;
  }
});

/* ============================================================
   6) منتقي الأيقونات
   ============================================================ */
let iconTarget = null, pendingImg = null;
function openIconPicker(target){
  iconTarget = target;
  $('#iconGrid').innerHTML = ICON_KEYS.map(function(k){
    return '<button data-k="'+k+'" aria-label="'+k+'">'+svg(k)+'</button>';
  }).join('');
  $('#sheet').classList.add('on');
}
$('#sheet').addEventListener('click', function(e){
  if(e.target.closest('[data-close]')){ $('#sheet').classList.remove('on'); return; }
  const b = e.target.closest('[data-k]'); if(!b || !iconTarget) return;
  const k = b.dataset.k;
  if(iconTarget.indexOf(':')>0){ const p=iconTarget.split(':'); S.data[p[0]][+p[1]][p[2]] = k; }
  else { const p = iconTarget.split('.'); S.data[p[0]][p[1]] = k; }
  $('#sheet').classList.remove('on');
  renderEditor(); renderCanvas();
});
document.addEventListener('keydown', e => { if(e.key==='Escape') $('#sheet').classList.remove('on'); });

/* رفع صورة شعار */
$('#imgPicker').addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0]; if(!f || !pendingImg) return;
  if(f.size > 2.5*1024*1024){ toast('الصورة كبيرة — اختر صورة أقل من 2.5 ميجابايت'); return; }
  const r = new FileReader();
  r.onload = function(){ S.data[pendingImg].img = r.result; pendingImg=null; renderEditor(); renderCanvas(); };
  r.readAsDataURL(f);
  e.target.value='';
});

/* ============================================================
   7) التبويبات
   ============================================================ */
function tab(which){
  const edit = which==='edit';
  $('#tabEdit').setAttribute('aria-selected', edit);
  $('#tabView').setAttribute('aria-selected', !edit);
  $('#paneEdit').classList.toggle('on', edit);
  $('#paneView').classList.toggle('on', !edit);
  if(!edit) requestAnimationFrame(fitStage);
  window.scrollTo({top:0, behavior:'smooth'});
}
$('#tabEdit').onclick = ()=>tab('edit');
$('#tabView').onclick = ()=>tab('view');

/* ============================================================
   8) التنزيل والحفظ
   ============================================================ */
function dl(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
}
function slug(){
  return (S.data.title||'تصميم').replace(/[\\/:*?"<>|]/g,'').trim().slice(0,40) || 'تصميم';
}

$('#btnSave').onclick = function(){
  dl(new Blob([JSON.stringify({v:1, data:S.data, theme:S.theme}, null, 2)], {type:'application/json'}), slug()+'.json');
  toast('تم حفظ ملف التصميم');
};
$('#btnOpen').onclick = ()=> $('#filePicker').click();
$('#filePicker').addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = function(){
    try{
      const o = JSON.parse(r.result);
      if(!o.data) throw 0;
      S.data = o.data; if(o.theme) S.theme = o.theme;
      renderEditor(); renderCanvas(); toast('تم فتح التصميم');
    }catch(err){ toast('هذا الملف ليس ملف تصميم صالح'); }
  };
  r.readAsText(f); e.target.value='';
});

$('#btnPrint').onclick = function(){ tab('view'); setTimeout(()=>window.print(), 250); };

$('#btnPng').onclick = async function(){
  tab('view');
  toast('جاري تجهيز الصورة…');
  await new Promise(r=>setTimeout(r,120));
  const node = $('#canvas');
  try{
    const w = node.offsetWidth, h = node.offsetHeight, scale = 2;
    const clone = node.cloneNode(true);
    clone.querySelectorAll('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));
    const xml = new XMLSerializer().serializeToString(clone);
    const css = document.getElementById('appcss').textContent.replace(/&/g,'&amp;');
    const svgStr =
      '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'+
      '<foreignObject x="0" y="0" width="100%" height="100%">'+
      '<div xmlns="http://www.w3.org/1999/xhtml" dir="rtl"><style>'+css+'</style>'+xml+'</div>'+
      '</foreignObject></svg>';
    const img = new Image();
    img.crossOrigin = 'anonymous';
    await new Promise(function(res, rej){
      img.onload = res; img.onerror = rej;
      img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr);
    });
    const cv = document.createElement('canvas');
    cv.width = w*scale; cv.height = h*scale;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    cv.toBlob(function(blob){
      if(!blob){ toast('تعذّر التصدير — استخدم «طباعة / PDF»'); return; }
      dl(blob, slug()+'.png'); toast('تم تنزيل الصورة');
    }, 'image/png');
  }catch(err){
    toast('تعذّر تصدير الصورة — استخدم زر الطباعة لحفظ PDF');
  }
};

/* ============================================================
   9) التشغيل
   ============================================================ */
$('#brandSeal').innerHTML = svg('seal');
$('#btnOpen').innerHTML = svg('folder');
$('#btnSave').innerHTML = svg('save');
$('#btnPrint').innerHTML = svg('print');
$('#btnPng').innerHTML = svg('download');
$('#stageNote').innerHTML = svg('sparkles')+'<span>المس أي نص في التصميم لتعديله مباشرة</span>';
$('.sheet-head .mini').innerHTML = svg('x');
document.querySelectorAll('.seg button').forEach(function(b,i){
  b.innerHTML = svg(i===0?'type':'image') + b.textContent;
});

renderEditor();
renderCanvas();
window.addEventListener('load', fitStage);

if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
